[project]
name = "keys"
version = "0.1.0"
description = "the aula f75 max as an 80-key colour display, driven from a mac"
requires-python = ">=3.13"
dependencies = [
  "hidapi>=0.14",
  "pyobjc-framework-Quartz>=11",
]

[project.scripts]
keys = "keys.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keys"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
